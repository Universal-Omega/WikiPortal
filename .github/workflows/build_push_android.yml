name: Artifact Build

on: [push]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v5.7.0
      with:
        distribution: temurin
        java-version: 21

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: false

    - name: Run Gradle
      run: ./gradlew :androidApp:assembleAlphaDebug

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: debug-build
        path: "androidApp/build/outputs/apk/alpha/debug/*.apk"

    - name: Upload Lint Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: lint-results
        path: |
          **/build/reports/lint-results-*.html
          **/build/reports/lint-results-*.xml

    - name: Run detekt with auto correct
      if: always()
      run: ./gradlew :composeApp:detekt --auto-correct

    - name: Open PR with detekt fixes
      if: always()
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Apply detekt auto fixes"
        committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        branch: detekt-autofix
        base: ${{ github.head_ref }}
        title: "Detekt auto fixes"
        body: "Automated detekt fixes generated from the CI run on this PR."
        delete-branch: true
