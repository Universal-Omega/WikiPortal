name: Renovate Gradle Wrapper

on:
  pull_request:
    paths:
      - gradle/wrapper/gradle-wrapper.properties

permissions:
  contents: write

concurrency:
  group: renovate-gradle-wrapper-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wrapper:
    if: >-
      startsWith(github.head_ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.ref }}

    - name: Set up JDK
      uses: actions/setup-java@v6.1.0
      with:
        distribution: temurin
        java-version: 25

    - name: Regenerate wrapper
      run: |
        props=gradle/wrapper/gradle-wrapper.properties
        url=$(sed -n 's/^distributionUrl=//p' "$props" | tr -d '\\')
        sum=$(sed -n 's/^distributionSha256Sum=//p' "$props")
        for run in 1 2; do
          ./gradlew wrapper \
            --gradle-distribution-url "$url" \
            --gradle-distribution-sha256-sum "$sum"
        done

    - name: Commit changes
      run: |
        if [ -z "$(git status --porcelain)" ]; then
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add gradle/wrapper gradlew gradlew.bat
        git commit -m "build: regenerate Gradle wrapper"
        git push
