name: Renovate Material3

on:
  pull_request:
    paths:
      - gradle/libs.versions.toml

permissions:
  contents: write

concurrency:
  group: renovate-material3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  material3:
    if: >-
      startsWith(github.head_ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0

    - name: Sync Material3 version
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        file=gradle/libs.versions.toml
        if ! git diff -U0 "origin/$BASE_REF...HEAD" -- "$file" | grep -q '^+composeMultiplatform = '; then
          exit 0
        fi
        cmp=$(sed -n 's/^composeMultiplatform = "\(.*\)"/\1/p' "$file")
        body=$(gh release view "v$cmp" --repo JetBrains/compose-multiplatform --json body --jq .body)
        m3=$(printf '%s\n' "$body" | grep -oE 'org\.jetbrains\.compose\.material3:material3\*?:[A-Za-z0-9._+-]+' | head -n 1 | sed 's/.*://')
        if [ -z "$m3" ]; then
          echo "::error::No material3 version found in the v$cmp release notes"
          exit 1
        fi
        sed -i "s/^composeMaterial3 = \".*\"/composeMaterial3 = \"$m3\"/" "$file"
        if [ -z "$(git status --porcelain)" ]; then
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "$file"
        git commit -m "chore(deps): bump compose material3 to $m3"
        git push
