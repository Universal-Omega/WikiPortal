name: Generate XcodeGen PR

on:
  workflow_dispatch:
  push:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Configure Git info
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"

    - name: Create project.yml Configuration File
      run: |
        cat << 'EOF' > iosApp/project.yml
        name: iosApp
        options:
          bundleIdPrefix: org.wikitide
          deploymentTarget:
            iOS: "17.0"
          createIntermediateGroups: true

        settings:
          base:
            MARKETING_VERSION: "1.0.0"
            CURRENT_PROJECT_VERSION: "1"
            SWIFT_VERSION: "5.0"
            TARGETED_DEVICE_FAMILY: "1,2"
            SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
            SUPPORTS_MACCATALYST: YES
            SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
            ENABLE_USER_SCRIPT_SANDBOXING: NO
            EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

        targets:
          iosApp:
            type: application
            platform: iOS
            sources:
              - path: iosApp
                excludes:
                  - "**/.DS_Store"

            info:
              path: iosApp/Info.plist
              properties:
                CFBundleDevelopmentRegion: en
                CFBundleDisplayName: WikiPortal
                CFBundleExecutable: $(EXECUTABLE_NAME)
                CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
                CFBundleInfoDictionaryVersion: "6.0"
                CFBundleName: $(PRODUCT_NAME)
                CFBundlePackageType: APPL
                CFBundleShortVersionString: $(MARKETING_VERSION)
                CFBundleVersion: $(CURRENT_PROJECT_VERSION)
                LSRequiresIPhoneOS: true
                UIApplicationSceneManifest:
                  UIApplicationSupportsMultipleScenes: false
                UILaunchScreen: {}
                UISupportedInterfaceOrientations:
                  - UIInterfaceOrientationPortrait
                  - UIInterfaceOrientationLandscapeLeft
                  - UIInterfaceOrientationLandscapeRight
                UISupportedInterfaceOrientations~ipad:
                  - UIInterfaceOrientationPortrait
                  - UIInterfaceOrientationPortraitUpsideDown
                  - UIInterfaceOrientationLandscapeLeft
                  - UIInterfaceOrientationLandscapeRight

            settings:
              base:
                PRODUCT_BUNDLE_IDENTIFIER: org.wikitide.wikiportal
                PRODUCT_NAME: "$(TARGET_NAME)"
                ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
                CODE_SIGN_STYLE: Automatic
                DEVELOPMENT_ASSET_PATHS: "\"iosApp/Preview Content\""
                ENABLE_PREVIEWS: YES
                SWIFT_EMIT_LOC_STRINGS: YES
                FRAMEWORK_SEARCH_PATHS:
                  - "$(inherited)"
                  - "$(PROJECT_DIR)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
                LD_RUNPATH_SEARCH_PATHS:
                  - "$(inherited)"
                  - "@executable_path/Frameworks"
                OTHER_LDFLAGS:
                  - $(inherited)
                  - -lsqlite3

            preBuildScripts:
              - name: Compile Kotlin Framework
                script: |
                  cd "$SRCROOT/.."
                  ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
                basedOnDependencyAnalysis: false

        schemes:
          iosApp:
            build:
              targets:
                iosApp: all
            run:
              config: Debug
            archive:
              config: Release
        EOF

    - name: Install XcodeGen via Homebrew
      run: brew install xcodegen

    - name: Wipe and Fully Regenerate Xcode Project folder
      run: |
        cd iosApp
        rm -rf iosApp.xcodeproj
        xcodegen generate

    - name: Create Pull Request with Automated Changes
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: migrate iosApp to automated XcodeGen regeneration on the fly"
        title: "Migrate iOS Project Structure to XcodeGen Tracking"
        body: "fix iosApp"
        branch: fix/automate-xcodegen-regeneration
        delete-branch: true
