name: Debug Launch on Simulator

on:
  workflow_dispatch:
#  push:

permissions:
  contents: read

jobs:
  simulator-debug:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install XcodeGen via Homebrew
      run: brew install xcodegen

    - name: Regenerate Xcode project
      run: |
        cd iosApp
        xcodegen generate

    - name: List available simulators
      run: xcrun simctl list devices available

    - name: Boot a simulator
      run: |
        xcrun simctl list devices available -j > devices.json
        cat devices.json

        UDID=$(python3 -c "
        import json
        with open('devices.json') as f:
            data = json.load(f)
        for runtime, devices in data['devices'].items():
            if 'iOS' not in runtime or 'tvOS' in runtime:
                continue
            for d in devices:
                available = d.get('isAvailable', d.get('availability', '') == '(available)')
                if available and d.get('name', '').startswith('iPhone'):
                    print(d['udid'])
                    break
            else:
                continue
            break
        ") || true

        if [ -z "$UDID" ]; then
          echo "No matching simulator found. Full device list was printed above, check it for the actual schema/names."
          exit 1
        fi

        echo "Using simulator: $UDID"
        echo "UDID=$UDID" >> $GITHUB_ENV
        xcrun simctl boot "$UDID"

    - name: Build for simulator
      run: |
        cd iosApp
        xcodebuild build \
          -project iosApp.xcodeproj \
          -scheme iosApp \
          -destination "id=$UDID" \
          -derivedDataPath ./build

    - name: Install app on simulator
      run: |
        APP_PATH=$(find iosApp/build -name "iosApp.app" -path "*Debug-iphonesimulator*" | head -1)
        xcrun simctl install "$UDID" "$APP_PATH"

    - name: Launch app and capture console output
      run: |
        xcrun simctl launch --console-pty "$UDID" org.wikitide.wikiportal > launch_output.log 2>&1 &
        LAUNCH_PID=$!
        sleep 20
        kill $LAUNCH_PID 2>/dev/null || true
        wait $LAUNCH_PID 2>/dev/null || true
        cat launch_output.log

    - name: Collect crash reports if any
      run: |
        mkdir -p crash_reports
        find ~/Library/Logs/DiagnosticReports -iname "*iosApp*" -exec cp {} crash_reports/ \; || true
        xcrun simctl spawn "$UDID" log collect --output simulator_logs.logarchive || true

    - name: Upload debug artifacts
      uses: actions/upload-artifact@v7
      with:
        name: simulator-debug-output
        path: |
          launch_output.log
          crash_reports/
          simulator_logs.logarchive
