name: Artifact Build

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: false

    - name: Run Gradle
      run: ./gradlew :androidApp:assembleDebug

    - name: Run Gradle wasmJs
      run: ./gradlew :composeApp:wasmJsBrowserDistribution

   # - name: Run Gradle desktop
   #   run: ./gradlew :composeApp:run

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pull-request-build
        path: "**/build/outputs/**"

    - name: Upload Artifact Wasm
      uses: actions/upload-artifact@v7
      with:
        name: pull-request-build-wasm
        path: "**/build/dist/**"

  ios-framework:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: false

    - name: Build iosApp with xcodebuild
      run: |
        cd iosApp
        xcodebuild -project iosApp.xcodeproj -scheme iosApp \
          -destination "platform=iOS Simulator,name=iPhone 17" build

  ios-unsigned-ipa:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: false

    - name: Build archive with asset compilation
      run: |
        cd iosApp
        xcodebuild -project iosApp.xcodeproj -scheme iosApp \
          -configuration Release -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
          -destination "generic/platform=iOS" \
          CODE_SIGNING_ALLOWED=NO \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          archive

    - name: Compile Asset Catalog
      run: |
        xcrun actool iosApp/iosApp/Assets.xcassets \
          --compile "$RUNNER_TEMP/iosApp.xcarchive/Products/Applications/iosApp.app" \
          --platform iphoneos \
          --minimum-deployment-target 15.0 \
          --app-icon AppIcon

    - name: Package unsigned .ipa
      run: |
        mkdir -p "$RUNNER_TEMP/Payload"
        cp -r "$RUNNER_TEMP/iosApp.xcarchive/Products/Applications/iosApp.app" "$RUNNER_TEMP/Payload/"
        cd "$RUNNER_TEMP"
        zip -r WikiPortal-unsigned.ipa Payload

    - name: Upload .ipa
      uses: actions/upload-artifact@v7
      with:
        name: wikiportal-unsigned-ipa
        path: "${{ runner.temp }}/WikiPortal-unsigned.ipa"

  desktop-dmg:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: false

    - name: Package macOS .dmg
      run: ./gradlew :composeApp:packageDmg

    - name: Upload dmg
      uses: actions/upload-artifact@v7
      with:
        name: wikiportal-macos-dmg
        path: "composeApp/build/compose/binaries/main/dmg/*.dmg"

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: false

    - name: Build signed release bundle
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: ./gradlew :androidApp:bundleRelease

    - name: Upload release bundle
      uses: actions/upload-artifact@v7
      with:
        name: release-bundle
        path: androidApp/build/outputs/bundle/release/*.aab
