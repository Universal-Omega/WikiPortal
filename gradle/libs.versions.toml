[versions]
androidGradlePlugin = "9.3.1"
androidxActivityCompose = "1.13.0"
androidxCore = "1.19.0"
androidxSqlite = "2.7.0"
buildkonfigGradlePlugin = "0.22.0"
coil = "3.5.0"
composeMaterial3 = "1.11.0-alpha07"
